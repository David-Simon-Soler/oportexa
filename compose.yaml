services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opportunity_intel
      POSTGRES_USER: opportunity_intel
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - opportunity_intel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opportunity_intel -d opportunity_intel"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  opportunity_intel_postgres:

