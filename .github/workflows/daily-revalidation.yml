name: Daily BDNS revalidation

on:
  schedule:
    # 06:15 UTC, outside the usual working-hours peak.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oportexa-bdns-ingestion
  cancel-in-progress: false

defaults:
  run:
    working-directory: services/ingestion

jobs:
  revalidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BDNS_API_BASE_URL: https://www.infosubvenciones.es/bdnstrans/api
      BDNS_TIMEOUT_SECONDS: "20"
      BDNS_PAGE_SIZE: "100"
      BDNS_PAUSE_SECONDS: "0.2"
      BDNS_MAX_RETRIES: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingestion/pyproject.toml

      - name: Install ingestion service
        run: python -m pip install -e ".[dev]"

      - name: Revalidate the last three days
        env:
          DATABASE_URL: ${{ secrets.OPORTEXA_INGEST_DATABASE_URL }}
        run: |
          DATE_TO="$(date -u +%F)"
          DATE_FROM="$(date -u -d '2 days ago' +%F)"
          python scripts/backfill_calls.py \
            --date-from "$DATE_FROM" \
            --date-to "$DATE_TO" \
            --window daily \
            --max-windows 3 \
            --max-records 500 \
            --retry-failed \
            --page-size 100

      - name: Run data quality report
        env:
          DATABASE_URL: ${{ secrets.OPORTEXA_INGEST_DATABASE_URL }}
        run: python scripts/data_quality_report.py

      - name: Enforce data quality gate
        env:
          DATABASE_URL: ${{ secrets.OPORTEXA_INGEST_DATABASE_URL }}
        run: python scripts/quality_gate.py

      - name: Inspect ingestion operations
        if: always()
        env:
          DATABASE_URL: ${{ secrets.OPORTEXA_INGEST_DATABASE_URL }}
        run: python scripts/inspect_ingestion_runs.py --failed
