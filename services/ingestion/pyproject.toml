[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-ingestion"
version = "0.1.0"
description = "Read-only exploratory client for the BDNS/SNPSAP public API."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.alembic]
script_location = "alembic"
